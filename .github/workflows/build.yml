name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar arquivos do app
        run: |
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FreeFireMenu"
          include ':app'
          EOF_FILE
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.meuapp.ffmenu'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.meuapp.ffmenu'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <queries>
                  <package android:name="com.dts.freefireth" />
                  <package android:name="com.dts.freefiremax" />
              </queries>

              <application
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FloatingService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="floating_shortcut" />
                  </service>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <resources>
              <string name="app_name">FF Menu</string>
          </resources>
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF_FILE'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#E50914"
                  android:pathData="M54,54m-50,0a50,50 0,1 1,100 0a50,50 0,1 1,-100 0" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M44,34L78,54L44,74Z" />
          </vector>
          EOF_FILE
          mkdir -p app/src/main/java/com/meuapp/ffmenu
          cat > app/src/main/java/com/meuapp/ffmenu/MainActivity.kt <<'EOF_FILE'
          package com.meuapp.ffmenu

          import android.Manifest
          import android.app.Activity
          import android.content.ActivityNotFoundException
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              companion object {
                  const val FF = "com.dts.freefireth"
                  const val FF_MAX = "com.dts.freefiremax"
              }

              private lateinit var status: TextView

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#0D0D0D"))
                      setPadding(dp(32), dp(32), dp(32), dp(32))
                  }

                  val title = TextView(this).apply {
                      text = "FREE FIRE"
                      setTextColor(Color.WHITE)
                      textSize = 28f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, dp(8))
                  }
                  val sub = TextView(this).apply {
                      text = "Toque para abrir o jogo com o ícone flutuante"
                      setTextColor(Color.parseColor("#AAAAAA"))
                      textSize = 14f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, dp(32))
                  }
                  status = TextView(this).apply {
                      setTextColor(Color.parseColor("#AAAAAA"))
                      textSize = 12f
                      gravity = Gravity.CENTER
                      setPadding(0, dp(24), 0, 0)
                  }

                  root.addView(title)
                  root.addView(sub)
                  root.addView(redButton("ABRIR FREE FIRE") { launchGame(FF) })
                  root.addView(redButton("ABRIR FREE FIRE MAX") { launchGame(FF_MAX) })
                  root.addView(status)
                  setContentView(root)

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  status.text = if (Settings.canDrawOverlays(this))
                      "Permissão do ícone flutuante: ativa ✔"
                  else
                      "Permissão do ícone flutuante: falta ativar"
              }

              private fun redButton(label: String, onClick: () -> Unit): Button {
                  return Button(this).apply {
                      text = label
                      setTextColor(Color.WHITE)
                      textSize = 16f
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#E50914"))
                          cornerRadius = dp(12).toFloat()
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(56)
                      ).apply { bottomMargin = dp(16) }
                      setOnClickListener { onClick() }
                  }
              }

              private fun launchGame(pkg: String) {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(
                          this,
                          "Ative \"Sobrepor a outros apps\" para este app e volte",
                          Toast.LENGTH_LONG
                      ).show()
                      startActivity(
                          Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                      )
                      return
                  }

                  val gameIntent = packageManager.getLaunchIntentForPackage(pkg)
                  if (gameIntent == null) {
                      Toast.makeText(this, "Jogo não instalado. Abrindo a Play Store...", Toast.LENGTH_LONG).show()
                      try {
                          startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=$pkg")))
                      } catch (e: ActivityNotFoundException) {
                          startActivity(
                              Intent(Intent.ACTION_VIEW, Uri.parse("https://play.google.com/store/apps/details?id=$pkg"))
                          )
                      }
                      return
                  }

                  startForegroundService(Intent(this, FloatingService::class.java).putExtra("pkg", pkg))
                  startActivity(gameIntent)
              }
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/meuapp/ffmenu
          cat > app/src/main/java/com/meuapp/ffmenu/FloatingService.kt <<'EOF_FILE'
          package com.meuapp.ffmenu

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.IBinder
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.abs

          class FloatingService : Service() {

              private var wm: WindowManager? = null
              private var root: LinearLayout? = null
              private var bubble: TextView? = null
              private var menu: LinearLayout? = null
              private var params: WindowManager.LayoutParams? = null
              private var minimized = false
              private var gamePkg = MainActivity.FF

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  gamePkg = intent?.getStringExtra("pkg") ?: gamePkg
                  startForeground(1, buildNotification())
                  if (root == null) showBubble()
                  return START_NOT_STICKY
              }

              private fun buildNotification(): Notification {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("ff_float", "Ícone flutuante", NotificationManager.IMPORTANCE_LOW)
                  )
                  return Notification.Builder(this, "ff_float")
                      .setContentTitle("Ícone flutuante ativo")
                      .setContentText("Toque no ícone sobre o jogo para ver as opções")
                      .setSmallIcon(R.drawable.ic_launcher)
                      .build()
              }

              private fun showBubble() {
                  val windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  wm = windowManager

                  val b = TextView(this).apply {
                      text = "FF"
                      setTextColor(Color.WHITE)
                      textSize = 16f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.parseColor("#E50914"))
                          setStroke(dp(2), Color.WHITE)
                      }
                      layoutParams = LinearLayout.LayoutParams(dp(56), dp(56))
                  }
                  bubble = b

                  val m = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      visibility = View.GONE
                      setPadding(dp(6), dp(6), dp(6), dp(6))
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#E6121212"))
                          cornerRadius = dp(12).toFloat()
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = dp(6) }
                  }
                  menu = m

                  m.addView(menuItem("Voltar ao jogo") { openPackage(gamePkg); m.visibility = View.GONE })
                  m.addView(menuItem("Abrir este app") { openPackage(packageName); m.visibility = View.GONE })
                  m.addView(menuItem("Minimizar") { minimize() })
                  m.addView(menuItem("Fechar ícone") { stopSelf() })

                  val r = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      addView(b)
                      addView(m)
                  }
                  root = r

                  val p = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dp(16)
                      y = dp(200)
                  }
                  params = p

                  b.setOnTouchListener(object : View.OnTouchListener {
                      var startX = 0
                      var startY = 0
                      var touchX = 0f
                      var touchY = 0f
                      var moved = false

                      override fun onTouch(v: View, e: MotionEvent): Boolean {
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  startX = p.x; startY = p.y
                                  touchX = e.rawX; touchY = e.rawY
                                  moved = false
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val dx = (e.rawX - touchX).toInt()
                                  val dy = (e.rawY - touchY).toInt()
                                  if (abs(dx) > dp(5) || abs(dy) > dp(5)) moved = true
                                  if (moved) {
                                      p.x = startX + dx
                                      p.y = startY + dy
                                      windowManager.updateViewLayout(r, p)
                                  }
                              }
                              MotionEvent.ACTION_UP -> if (!moved) onBubbleTap()
                          }
                          return true
                      }
                  })

                  windowManager.addView(r, p)
              }

              private fun onBubbleTap() {
                  val b = bubble ?: return
                  val m = menu ?: return
                  if (minimized) {
                      minimized = false
                      b.layoutParams = LinearLayout.LayoutParams(dp(56), dp(56))
                      b.alpha = 1f
                      b.text = "FF"
                  } else {
                      m.visibility = if (m.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                  }
                  refresh()
              }

              private fun minimize() {
                  val b = bubble ?: return
                  menu?.visibility = View.GONE
                  minimized = true
                  b.layoutParams = LinearLayout.LayoutParams(dp(28), dp(28))
                  b.alpha = 0.5f
                  b.text = ""
                  refresh()
              }

              private fun refresh() {
                  val r = root ?: return
                  r.requestLayout()
                  try { wm?.updateViewLayout(r, params) } catch (_: Exception) {}
              }

              private fun menuItem(label: String, onClick: () -> Unit): TextView {
                  return TextView(this).apply {
                      text = label
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      setPadding(dp(14), dp(10), dp(14), dp(10))
                      setOnClickListener { onClick() }
                  }
              }

              private fun openPackage(pkg: String) {
                  packageManager.getLaunchIntentForPackage(pkg)?.let {
                      it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(it)
                  }
              }

              override fun onDestroy() {
                  try { root?.let { wm?.removeView(it) } } catch (_: Exception) {}
                  root = null
                  super.onDestroy()
              }
          }
          EOF_FILE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FF-Menu-APK
          path: app/build/outputs/apk/debug/app-debug.apk
