name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Gerar projeto do app
        run: |
          mkdir app-src && cd app-src
          echo "" | base64 -d | tar xz
      - name: Compilar APK
        working-directory: app-src
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MeuApp-APK
          path: app-src/app/build/outputs/apk/debug/app-debug.apk
